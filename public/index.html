<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConSecAI</title>
    <!-- Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D3A56;
            --secondary-color: #5B6A8B;
            --background-color: #1A2132;
            --accent-color: #7280A3;
            --text-color: #f0f0f0;
            --input-bg-color: #4A5774;
            --message-bg-color: #3A465E;
            --box-shadow-color: rgba(0, 0, 0, 0.2);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            height: 90%;
            max-width: 600px;
            max-height: 800px;
            background-color: var(--primary-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--box-shadow-color);
            overflow: hidden;
            position: relative;
        }

        #chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-right-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--text-color);
            font-size: 0.9rem;
            text-decoration: none;
            z-index: 10;
        }

        .top-right-link:hover {
            text-decoration: underline;
        }

        #placeholder {
            text-align: center;
            margin-top: auto;
            margin-bottom: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #placeholder-logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
        }

        #placeholder-text {
            color: var(--accent-color);
            font-size: 0.9rem;
        }
        
        #chat-form {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--secondary-color);
            background-color: var(--primary-color);
        }

        #message-input {
            flex-grow: 1;
            padding: 15px;
            border: none;
            background-color: var(--input-bg-color);
            color: var(--text-color);
            border-radius: 10px;
            margin-right: 10px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            transition: box-shadow 0.3s ease;
        }

        #message-input:focus {
            box-shadow: 0 0 10px var(--accent-color);
        }

        #chat-form button {
            background-color: var(--accent-color);
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chat-form button:hover {
            background-color: #5B6A8B;
        }

        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .user-message {
            background-color: var(--secondary-color);
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .bot-message {
            background-color: var(--message-bg-color);
            margin-right: auto;
            border-bottom-left-radius: 0;
            position: relative;
        }
        
        .bot-message a {
            color: var(--accent-color);
            text-decoration: underline;
        }
        
        .hidden {
            display: none !important;
        }

        #utility-area {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--secondary-color);
        }

        .utility-button {
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .utility-button:hover {
            background-color: #4A5774;
        }
        
        #book-list {
            padding: 10px 15px;
            border-top: 1px solid var(--secondary-color);
        }
        
        .book-item {
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .book-item:hover {
            background-color: var(--secondary-color);
        }
        
        #typing-indicator {
            display: flex;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            margin: 0 4px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="chat-container">
            <div id="chat-window">
                <a href="kimideath.txt" class="top-right-link">kimideath.txt</a>
                <!-- Placeholder now contains the title -->
                <div id="placeholder">
                    <h1 style="font-family: 'Montserrat', sans-serif; font-weight: 450; text-align: center; margin-bottom: 15px;">ConSecAI</h1>
                    <img src="https://placehold.co/100x100/2D3A56/7280A3?text=AI" alt="AI Logo 2" id="placeholder-logo">
                    <p id="placeholder-text">Your trusted digital partner in communication and organization.</p>
                </div>
                
                <div id="typing-indicator" class="message bot-message hidden">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
            <!-- Container for the new buttons and book list -->
            <div id="utility-area">
                <button id="books-button" class="utility-button">Books</button>
            </div>
            
            <div id="book-list" class="hidden">
                <div class="book-item" data-url="https://bookserve-production.up.railway.app/book.html?name=theunheededoracle">
                    The Unheeded Oracle: A Dialogue on Wisdom 
                </div>
                <div class="book-item" data-url="https://bookserve-production.up.railway.app/book.html?name=book-full_the-genesis-of-aura">
                    The Genesis of AURA
                </div>
            </div>

            
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Ready to assist..." autocomplete="off" required>
                <!-- Change the button in your HTML to include an icon -->
                <button type="submit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatWindow = document.getElementById('chat-window');
            const chatForm = document.getElementById('chat-form');
            const messageInput = document.getElementById('message-input');
            const typingIndicator = document.getElementById('typing-indicator');
            const placeholder = document.getElementById('placeholder');
            const booksButton = document.getElementById('books-button');
            const bookList = document.getElementById('book-list');
        
            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const messageText = messageInput.value.trim();
                if (messageText) {
                    addMessage(messageText, 'user');
                    messageInput.value = '';
                    placeholder.classList.add('hidden');
                    simulateBotResponse();
                }
            });
        
            booksButton.addEventListener('click', () => {
                bookList.classList.toggle('hidden');
            });
        
            bookList.addEventListener('click', (e) => {
                const bookItem = e.target.closest('.book-item');
                if (bookItem) {
                    const url = bookItem.dataset.url;
                    window.open(url, '_blank');
                }
            });
        
            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(sender + '-message');
                messageDiv.textContent = text;
                chatWindow.appendChild(messageDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        
            function simulateBotResponse() {
                typingIndicator.classList.remove('hidden');
                chatWindow.scrollTop = chatWindow.scrollHeight;
                setTimeout(() => {
                    typingIndicator.classList.add('hidden');
                    const botResponse = "I'm sorry, I don't have an answer for that right now.";
                    addMessage(botResponse, 'bot');
                }, 1500);
            }
        });
    </script>
</body>
</html>
